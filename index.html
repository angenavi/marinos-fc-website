<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marinos FC Registration</title>

<style>
body{
font-family:Arial,sans-serif;
background:#0d3b8e;
padding:20px;
color:white;
text-align:center;
}

.container{
max-width:600px;
margin:auto;
}

.card{
background:white;
color:#222;
padding:20px;
border-radius:12px;
margin-top:20px;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
background:#ffd700;
border:none;
padding:12px 25px;
font-size:16px;
font-weight:bold;
border-radius:8px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

.success{
color:green;
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>MARINOS FOOTBALL CLUB</h1>
<h2>Player Registration</h2>

<div class="card">

<input type="text" id="player_name" placeholder="Player Name">

<input type="number" id="age" placeholder="Age">

<input type="text" id="parent_name" placeholder="Parent Name">

<input type="text" id="phone" placeholder="Phone Number">

<select id="package_name">
<option>Single Training Pass</option>
<option>Foundation Starter</option>
<option>Foundation Regular</option>
<option>Foundation Intensive</option>
<option>Foundation Advanced</option>
<option>Development Track</option>
</select>

<button onclick="registerPlayer()">
Register Player
</button>

<p id="msg" class="success"></p>

</div>

</div>

<script>

const SUPABASE_URL = "https://yvvxkobjkdjavjriksbq.supabase.co";
const SUPABASE_KEY = "sb_publishable_tO-vULbk4vUKbtOOOnSREA_iaJGUzj6";

async function registerPlayer(){

const player_name =
document.getElementById("player_name").value;

const age =
document.getElementById("age").value;

const parent_name =
document.getElementById("parent_name").value;

const phone =
document.getElementById("phone").value;

const package_name =
document.getElementById("package_name").value;

const response = await fetch(
`${SUPABASE_URL}/rest/v1/players`,
{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=minimal"
},
body:JSON.stringify({
player_name,
age,
parent_name,
phone,
package_name
})
}
);

if(response.ok){
document.getElementById("msg").innerHTML =
"Player Registered Successfully!";
}else{
document.getElementById("msg").innerHTML =
"Registration Failed";
}

}

</script>

</body>
</html>
